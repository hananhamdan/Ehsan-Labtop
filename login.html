<!doctype html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- ================= GOOGLE FONT ================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet"
  >


  

  <link href="./assets/css/output.css" rel="stylesheet">


  <title>تسجيل الدخول | إحسان لابتوب</title>

</head>


<body class="bg-Surface text-DarkNavy">


  <main class="container  items-center justify-center px-4 py-10  flex min-h-148.5 sm:min-h-150">




    <section class="w-full max-w-xl">



      <h2 class="mb-5 text-center text-PrimaryBlue">
     لابتوبي     </h2>


    

      <div class="rounded-xl border border-[#C3C6D6] bg-SurfaceLowest p-5 shadow-sm sm:p-7">


        <!-- ==============Title====================================== -->

        <h3 class="mb-7 text-center">
          تسجيل الدخول
        </h3>


        <form>


          <!--================== Email ================-->

          <div class="mb-5">

            <label
              for="email"
              class="mb-2 block text-sm"
            >
              البريد الإلكتروني أو رقم الهاتف
            </label>


            <div class="relative">

              <input
                type="email"
                id="email"
                placeholder="example@domain.com"
                dir="ltr"
                class="email"
              >


              <img
                src="./assets/icons/avatar.svg"
                alt=""
                class="absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 opacity-60"
              >

            </div>

          </div>



          <!--==================== Password ===========================-->

          <div class="mb-3">

            <label
              for="password"
              class="mb-2 block text-sm"
            >
              كلمة المرور
            </label>


            <div class="relative">

              <input
                type="password"
                id="password"
                placeholder="••••••••••"
                class="email"
              >


              

              <img src="./assets/icons/lock.svg"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"
              >
                
            


            

              <button
                type="button"
                class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"
                aria-label="إظهار كلمة المرور"
              >
                <img src="./assets/icons/hidden.svg">
              </button>

            </div>

          </div>



          <!--============== Forgot Password =============-->

          <div class="mb-6 text-left">

            <a
              href="#"
              class="text-xs text-PrimaryBlue transition hover:underline"
            >
              نسيت كلمة المرور؟
            </a>

          </div>



          <!-- ================Login Button==================== -->

          <button
            type="submit"
            class="button "
          >
            تسجيل الدخول
          </button>

        </form>


<!--======التسطير ===========-->
        

        <div class="my-7 flex items-center gap-2">

          <span class="h-px flex-1 bg-[#C3C6D6]"></span>
           أو
          <span class="text-xs text-gray-500">
           
          </span>

          <span class="h-px flex-1 bg-[#C3C6D6]"></span>

        </div>



        <!-- Social Login -->

        <div class="flex items-center justify-center gap-3">


          <!-- Facebook -->

          <a href="#">
          
           
          
            <img src="./assets/icons/facebook.svg"/>
        </a>


          <!-- Apple -->
<a href="#">
          
           
          
            <img src="./assets/icons/apple.svg"/>
        </a>


          <!-- Google -->

          <a href="#">
          
           
          
            <img src="./assets/icons/google.svg"/>
        </a>
        </div>



        <!-- Register -->

        <div class="mt-7 text-center text-sm">

          <span class="text-gray-600">
            ليس لديك حساب؟
          </span>

          <a
            href="#"
            class="mr-1 font-semibold text-PrimaryBlue hover:underline"
          >
            إنشاء حساب جديد
          </a>

        </div>

      </div>

    </section>

  </main>





</body>

</html>
