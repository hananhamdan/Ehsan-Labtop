<!doctype html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--  GOOGLE FONT -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">


  <!--  TAILWIND  -->

  <link href="./assets/css/output.css" rel="stylesheet">


  <title>إحسان لابتوب</title>

</head>


<body class="text-sm leading-normal lg:text-[1.125rem] lg:leading-7">


  <header class="w-full bg-white">

  <div class="container mx-auto">

    <nav class="h-13.75 flex items-center justify-between gap-5 px-3">

      <!-- Right: Logo -->
      <div class="shrink-0">
        <a href="#">
          <img
            src="./assets/img/logo.svg"
            alt="Laptop Store"
            class="w-8 h-8 object-contain"
          >
        </a>
      </div>


      <!-- Navigation -->
      <ul class="hidden md:flex items-center gap-5 text-[11px] text-gray-600">

        <!-- Home -->
        <li>
          <a
            href="#"
            class="relative flex items-center h-[55px] text-blue-700 font-bold
                   after:absolute after:bottom-0 after:right-0
                   after:w-full after:h-[2px] after:bg-blue-700"
          >
            الرئيسية
          </a>
        </li>

        <!-- Laptops -->
        <li>
          <a
            href="#"
            class="hover:text-blue-700 transition-colors duration-200"
          >
            اللابتوبات
          </a>
        </li>

        <!-- Brands -->
        <li>
          <a
            href="#"
            class="hover:text-blue-700 transition-colors duration-200"
          >
            ماركات
          </a>
        </li>

        <!-- Accessories -->
        <li>
          <a
            href="#"
            class="hover:text-blue-700 transition-colors duration-200"
          >
            إكسسوارات
          </a>
        </li>

        <!-- Offers -->
        <li>
          <a
            href="#"
            class="hover:text-blue-700 transition-colors duration-200"
          >
            عروض
          </a>
        </li>

      </ul>


      <!-- Search -->
      <div
        class="hidden sm:flex items-center
               w-[180px] md:w-[230px]
               h-[30px]
               rounded-full
               bg-gray-50
               border border-gray-100
               px-3"
      >

        <input
          type="text"
          placeholder="ابحث عن منتجاتنا..."
          class="w-full bg-transparent outline-none
                 text-[10px]
                 text-gray-700
                 placeholder:text-gray-400"
        >

        <button
          type="button"
          class="shrink-0"
        >
          <img
            src="./assets/icons/search.svg"
            alt="بحث"
            class="w-[15px] h-[15px]"
          >
        </button>

      </div>


      <!-- Left Icons -->
      <div class="flex items-center gap-4 shrink-0">

        <!-- Cart -->
        <a
          href="#"
          class="relative flex items-center justify-center"
        >
          <img
            src="./assets/icons/cart.svg"
            alt="السلة"
            class="w-[18px] h-[18px]"
          >

          <span
            class="absolute -top-[7px] -right-[7px]
                   flex items-center justify-center
                   w-[14px] h-[14px]
                   rounded-full
                   bg-blue-700
                   text-white
                   text-[8px]"
          >
            0
          </span>
        </a>


        <!-- Favorites -->
        <a
          href="#"
          class="flex items-center justify-center"
        >
          <img
            src="./assets/icons/heart.svg"
            alt="المفضلة"
            class="w-[17px] h-[17px]"
          >
        </a>


        <!-- Account -->
        <a
          href="#"
          class="flex items-center justify-center"
        >
          <img
            src="./assets/icons/avatar.svg"
            alt="الحساب"
            class="w-[19px] h-[19px]"
          >
        </a>

      </div>

    </nav>

  </div>

</header>


</body>

</html>
