<!doctype html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- ================= GOOGLE FONT ================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet"
  >


  <!-- ================= TAILWIND ================= -->

  <link
    href="./assets/css/output.css"
    rel="stylesheet"
  >


  <title>إحسان لابتوب</title>

</head>


<body>


 <!-- HEADER -->
  <!-- ================================================= -->

  <header class="bg-SurfaceLowest">

    <div class="container">

      <nav
        class="row h-[55px] justify-between gap-5 px-3"
      >


        <!-- ================= LOGO ================= -->

        <div class="shrink-0">

          <a href="./index.html">

            <img
              src="./assets/img/brand.png"
              alt="إحسان لابتوب"
              class="h-10 w-auto object-contain"
            >

          </a>

        </div>


        <!-- ================= SEARCH ================= -->

        <div
          class="hidden h-[30px] w-[180px] items-center
                 rounded-full border border-gray-100
                 bg-gray-50 px-3 sm:flex md:w-[230px]"
        >

          <input
            type="text"
            placeholder="ابحث عن منتجاتنا..."
            class="w-full bg-transparent text-sm
                   text-gray-700 outline-none
                   placeholder:text-gray-400"
          >

          <button
            type="button"
            class="shrink-0"
          >

            <img
              src="./assets/icons/search.svg"
              alt="بحث"
              class="h-[15px] w-[15px]"
            >

          </button>

        </div>


        <!-- ================= NAVIGATION ================= -->

        <ul
          class="hidden items-center gap-5 text-gray-600 md:flex"
        >

          <!-- الرئيسية -->

          <li>

            <a
              href="#"
              class="relative flex h-[55px] items-center
                     font-bold text-blue-700
                     after:absolute
                     after:bottom-0
                     after:right-0
                     after:h-0.5
                     after:w-full
                     after:bg-blue-700"
            >

              الرئيسية

            </a>

          </li>


          <!-- اللابتوبات -->

          <li>

            <a
              href="#"
              class="transition-colors duration-200
                     hover:text-blue-700"
            >

              اللابتوبات

            </a>

          </li>


          <!-- ماركات -->

          <li>

            <a
              href="#"
              class="transition-colors duration-200
                     hover:text-blue-700"
            >

              ماركات

            </a>

          </li>


          <!-- إكسسوارات -->

          <li>

            <a
              href="#"
              class="transition-colors duration-200
                     hover:text-blue-700"
            >

              إكسسوارات

            </a>

          </li>


          <!-- عروض -->

          <li>

            <a
              href="#"
              class="transition-colors duration-200
                     hover:text-blue-700"
            >

              عروض

            </a>

          </li>

        </ul>


        <!-- ================= ICONS ================= -->

        <div
          class="row shrink-0 gap-4"
        >


          <!-- Cart -->

          <a
            href="#"
            class="relative flex items-center justify-center"
          >

            <img
              src="./assets/icons/carage.svg"
              alt="السلة"
              class="h-5 w-5"
            >

            <span
              class="absolute -right-2 -top-2
                     row h-[14px] w-[14px]
                     justify-center
                     rounded-full
                     bg-Secondary
                     text-[8px]
                     text-white"
            >

              0

            </span>

          </a>


          <!-- Favorites -->

          <a
            href="#"
            class="flex items-center justify-center"
          >

            <img
              src="./assets/icons/heart.svg"
              alt="المفضلة"
              class="h-[17px] w-[17px]"
            >

          </a>


          <!-- Account -->

          <a
            href="#"
            class="flex items-center justify-center"
          >

            <img
              src="./assets/icons/avatar.svg"
              alt="الحساب"
              class="h-[19px] w-[19px]"
            >

          </a>

        </div>

      </nav>

    </div>

  </header>



  <!-- ================================================= -->
  <!-- HERO -->
  <!-- ================================================= -->

  <section
    class="container relative h-125
           overflow-hidden
           rounded-bl-[48px]
           rounded-br-[48px]"
  >


    <!-- ================= HERO IMAGE ================= -->

    <img
      src="./assets/img/hero.webp"
      alt="ASUS ROG Strix G16"
      class="absolute inset-0
             h-full w-full
             object-cover"
    >


    <!-- ================= OVERLAY ================= -->

    <div
      class="absolute inset-0 bg-black/40"
    ></div>


    <!-- ================= HERO CONTENT ================= -->

    <div
      class="relative z-10 flex h-full
             flex-col items-start
             justify-center
             px-6 text-right text-white
             md:px-10"
    >


      

      <div
        class="rounded-2xl
               bg-Error
               px-4 py-1"
      >

        <h5 class="text-sm">

          أحدث الإصدارات

        </h5>

      </div>


      

      <h1 class="mt-4">

        قوة لا تُقهر مع

      </h1>


      <h1>

        ASUS ROG Strix G16

      </h1>


     

      <p
        class="mt-4 max-w-lg
               text-sm leading-7
               md:text-base"
      >

        استمتع بتجربة لعب استثنائية مع
        معالج Intel Core i9 وبطاقة رسومات
        RTX 4070.
        <br>

        الأداء الذي تبحث عنه، الآن بين يديك.

      </p>


      <!-- ================= BUTTONS ================= -->

      <div class="row gap-4">


        <!-- Primary Button -->

        <a
          href="#"
          class="button"
        >

          تسوق الآن

          <span>

            ←

          </span>

        </a>


        <!-- Secondary Button -->

        <a
          href="#"
          class="mt-6
                 rounded-md
                 border border-white/50
                 bg-white/20
                 px-7 py-3
                 text-sm font-bold
                 text-white
                 shadow-2xl
                 backdrop-blur-sm
                 transition duration-300
                 hover:bg-white/30"
        >

          عرض المواصفات

        </a>

      </div>

    </div>

  </section>



  
  <!-- SHOP BY CATEGORY -->
  

  <section class="container py-12">


    <div class="row justify-between">


    

      <h2>

        تسوق حسب الفئة

      </h2>


     
      

      <a
        href="#"
        class="text-Secondary
               transition
               hover:text-SecondaryContainer"
      >

        عرض الكل

        <span>

          ←

        </span>

      </a>


    </div>


  </section>


</body>

</html>
